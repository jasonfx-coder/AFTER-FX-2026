name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Android project
        run: |
          pip install pillow
          M=app/src/main
          mkdir -p $M/assets $M/java/com/afterfx
          cp index.html $M/assets/index.html
          python3 - <<'PY'
          from PIL import Image
          import os
          im = Image.open('icon.png').convert('RGBA')
          for d, n in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p = 'app/src/main/res/mipmap-' + d
              os.makedirs(p, exist_ok=True)
              im.resize((n, n), Image.LANCZOS).save(p + '/ic_launcher.png')
          PY
          cat > settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AfterFX2026"
          include(":app")
          EOT
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOT
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties
          cat > app/build.gradle.kts <<'EOT'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.afterfx"
              compileSdk = 34
              defaultConfig { applicationId = "com.afterfx.editor2026"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "0.1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOT
          cat > $M/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="AFTER FX 2026" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > $M/java/com/afterfx/MainActivity.kt <<'EOT'
          package com.afterfx
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.webkit.WebView
          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.parseColor("#100b1b")
                  window.navigationBarColor = Color.parseColor("#100b1b")
                  val web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#07050d"))
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.loadUrl("file:///android_asset/index.html")
                  setContentView(web)
              }
          }
          EOT
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AfterFX2026-apk
          path: app/build/outputs/apk/debug/app-debug.apk
